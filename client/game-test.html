<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>混乱棋局 - 局内测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgb(253, 248, 240);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            background: transparent;
            padding: 24px;
            max-width: 1200px;
            width: 100%;
        }

        #canvas {
            border: 2px solid #333;
            display: block;
            margin: 0 auto;
            background: #f5f5dc;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #666;
        }

        #kill-feed {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 50;
        }

        .kill-feed-item {
            display: flex;
            align-items: center;
            background: rgba(251, 245, 236, 0.96);
            border: 1px solid #e4d8c9;
            color: #2f2a22;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(75, 63, 47, 0.16);
            animation: slideIn 0.3s ease;
        }

        .kill-feed-item.fading {
            animation: fadeOut 0.5s ease forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        #notification-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(253, 248, 240, 0.98);
            color: #2f2a22;
            padding: 30px 40px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(75, 63, 47, 0.2);
            z-index: 1000;
            display: none;
            text-align: center;
            min-width: 300px;
            border: 2px solid #e4d8c9;
        }

        #notification-container.show {
            display: block;
            animation: notificationPop 0.3s ease;
        }

        @keyframes notificationPop {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="kill-feed"></div>
    <div id="notification-container"></div>

    <div id="app">
        <div id="lobby-view" style="display:none; margin: 8px 0 12px 0;"></div>
        <div id="room-view" style="display:none; margin: 8px 0 12px 0;"></div>

        <div id="match-view" style="display:block;">
            <canvas id="canvas" width="500" height="550"></canvas>
            <div id="status">正在加载局内测试模式...</div>
        </div>
    </div>

    <div id="promotion-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
            <h3 style="margin-bottom: 20px; color: #333;">♟️ 兵升变选择</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="window.app.handlePromotion('Queen')"
                    style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #667eea; color: white; border: none; border-radius: 5px;">♕
                    后 (Queen)</button>
                <button onclick="window.app.handlePromotion('Rook')"
                    style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #764ba2; color: white; border: none; border-radius: 5px;">♖
                    车 (Rook)</button>
                <button onclick="window.app.handlePromotion('Bishop')"
                    style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px;">♗
                    象 (Bishop)</button>
                <button onclick="window.app.handlePromotion('Knight')"
                    style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #FF9800; color: white; border: none; border-radius: 5px;">♘
                    马 (Knight)</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>

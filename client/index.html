<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>混乱棋局 - Chaos Chess</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgb(253, 248, 240);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            background: transparent;
            border-radius: 0;
            box-shadow: none;
            padding: 30px;
            max-width: 1200px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        #canvas {
            border: 2px solid #333;
            display: block;
            margin: 0 auto;
            background: #f5f5dc;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #666;
        }

        .plugin-info {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .plugin-info h3 {
            margin-bottom: 10px;
            color: #667eea;
        }

        .plugin-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .plugin-badge {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* Poker Hand Container */
        #poker-hand-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        #poker-hand-container.translate-y-full {
            transform: translateY(100%);
        }

        .poker-card {
            display: inline-block;
            width: 60px;
            height: 90px;
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            margin: 0 5px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }

        .poker-card:hover {
            transform: translateY(-10px);
        }

        .poker-card.selected {
            transform: translateY(-20px);
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .poker-card.red {
            color: #C8102E;
        }

        .poker-card.black {
            color: #1a1a1a;
        }

        /* Kill Feed */
        #kill-feed {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 50;
        }

        .kill-feed-item {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #666;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        .kill-feed-item.fading {
            animation: fadeOut 0.5s ease forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        /* Notification System */
        #notification-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 30px 40px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            text-align: center;
            min-width: 300px;
            border: 3px solid #FFD700;
        }

        #notification-container.show {
            display: block;
            animation: notificationPop 0.3s ease;
        }

        @keyframes notificationPop {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Kill Feed -->
    <div id="kill-feed"></div>

    <!-- Notification Container -->
    <div id="notification-container"></div>

    <div id="app">
        <div id="lobby-view" style="display:none; margin: 8px 0 12px 0;"></div>
        <div id="room-view" style="display:none; margin: 8px 0 12px 0;"></div>

        <div id="match-view" style="display:none;">
            <canvas id="canvas" width="500" height="550"></canvas>

            <div id="status">
                正在加载插件系统...
            </div>
        </div>
    </div>

    <!-- Poker Hand Container -->
    <div id="poker-hand-container" class="translate-y-full">
        <div style="max-width: 1200px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div>
                    <span id="poker-player-name" style="color: #ff4444; font-size: 18px; font-weight: bold;">红方</span>
                    <span style="color: #999; margin-left: 10px;">手牌</span>
                </div>
                <div>
                    <span style="color: #FFD700; margin-right: 15px;" id="selected-hand-type">请选择5张牌</span>
                    <button id="play-poker-btn" onclick="window.app.playPokerHand()"
                        style="background: #4CAF50; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px;">✨
                        出牌</button>
                    <span id="poker-unlock-tip" style="color: #fca5a5; margin-right: 10px; font-size: 13px; display: none;">需先在商店购买“德州扑克效果”</span>
                    <button onclick="window.app.togglePoker()"
                        style="background: #666; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer;">🔽
                        收起</button>
                </div>
            </div>
            <div id="hand-cards" style="text-align: center;"></div>
        </div>
    </div>

    <!-- Promotion Modal -->
    <div id="promotion-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center;">
        <div
            style="background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
            <h3 style="margin-bottom: 20px; color: #333;">♟️ 兵升变选择</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="window.app.handlePromotion('Queen')"
                    style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #667eea; color: white; border: none; border-radius: 5px;">♕
                    后 (Queen)</button>
                <button onclick="window.app.handlePromotion('Rook')"
                    style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #764ba2; color: white; border: none; border-radius: 5px;">♖
                    车 (Rook)</button>
                <button onclick="window.app.handlePromotion('Bishop')"
                    style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px;">♗
                    象 (Bishop)</button>
                <button onclick="window.app.handlePromotion('Knight')"
                    style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #FF9800; color: white; border: none; border-radius: 5px;">♘
                    马 (Knight)</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
